<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>The Show Must Go On · Stage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Outfit:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    body { overflow-x: hidden; }
    .stage {
      min-height: 100vh;
      padding: 4vh 4vw 120px;
      display: grid;
      align-content: start;
      gap: 3vh;
    }
    .stage h1, .stage h2 {
      font-family: var(--font-display);
      font-weight: 400;
      color: var(--brass);
      margin: 0;
      line-height: 1.05;
      text-wrap: balance;
      text-shadow: 0 0 28px rgba(241, 191, 85, 0.3);
    }
    .stage h1 { font-size: clamp(40px, 7vw, 110px); }
    .stage h2 { font-size: clamp(30px, 4.6vw, 72px); }
    .stage .eyebrow { font-size: clamp(14px, 1.3vw, 22px); }
    .lead { font-size: clamp(18px, 2vw, 32px); }
    .lobby { display: grid; grid-template-columns: 1fr auto; gap: 4vw; align-items: center; }
    .qr { background: var(--paper); padding: 18px; border-radius: 18px; width: clamp(200px, 26vw, 420px); }
    .qr svg { display: block; width: 100%; height: auto; }
    .url { font-size: clamp(14px, 1.4vw, 22px); color: var(--muted); word-break: break-all; }
    .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2vw; }
    .opt {
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 2.4vw;
      background: rgba(251, 241, 225, 0.05);
      display: grid; gap: 1.2vw; align-content: start;
      font-size: clamp(18px, 1.9vw, 34px);
      transition: opacity 0.5s, border-color 0.5s, transform 0.5s;
    }
    .opt .letter { font-family: var(--font-display); color: var(--brass); font-size: 1.8em; line-height: 1; }
    .opt .who { font-size: 0.62em; color: var(--muted); }
    .opt.correct { border-color: var(--ok); background: rgba(127, 212, 155, 0.15); transform: scale(1.03); }
    .opt.dim { opacity: 0.35; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: clamp(14px, 1.2vw, 20px); }
    .chip.on { border-color: var(--brass); background: rgba(241, 191, 85, 0.15); }
    .verdict { font-size: clamp(22px, 2.6vw, 44px); font-weight: 700; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 28vw); gap: 3vw; align-items: start; }
    .board { font-size: clamp(16px, 1.6vw, 28px); }
    .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2vw; align-items: end; text-align: center; }
    .podium .step { border: 2px solid var(--brass); border-radius: 18px 18px 0 0; padding: 2vw 1vw; background: rgba(241, 191, 85, 0.1); }
    .podium .step .nm { font-family: var(--font-display); font-size: clamp(22px, 3vw, 54px); color: var(--paper); }
    .podium .step .pt { font-size: clamp(16px, 1.8vw, 30px); color: var(--brass); font-weight: 700; }
    .podium .p1 { min-height: 34vh; } .podium .p2 { min-height: 25vh; } .podium .p3 { min-height: 18vh; }
    .rest { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 3vw; font-size: clamp(16px, 1.5vw, 26px); }
    .rest div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 4px 0; }
    .rest strong { color: var(--brass); }
    .controls {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 12px 4vw;
      background: rgba(23, 10, 18, 0.92);
      border-top: 1px solid var(--line);
      font-size: 15px;
      z-index: 5;
    }
    .controls .btn { padding: 8px 16px; }
    .controls .spacer { flex: 1; }
    .controls.hidden-bar { opacity: 0; }
    .controls.hidden-bar:hover { opacity: 1; }
    @media (max-width: 800px) {
      .lobby, .split { grid-template-columns: 1fr; }
      .opts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage"><p class="lead muted">Setting the stage…</p></main>
  <nav class="controls" id="controls" aria-label="Host controls"></nav>
  <div class="toast" id="toast" hidden></div>
  <script src="config.js?v=2"></script>
  <script src="api.js?v=2"></script>
  <script src="qrcode.js?v=2"></script>
  <script src="tv.js?v=2"></script>
</body>
</html>
